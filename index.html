  <!-- ── Dynamic favicon: swap on dark/light mode toggle ────────────── -->
  <script>
    (function () {
      function applyFavicon() {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches ||
          document.documentElement.classList.contains('dark');
        var el = document.getElementById('favicon');
        if (el) el.setAttribute('href', dark ? '/favicon-dark.png' : '/favicon-light.png');
      }
      // On system preference change
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyFavicon);
      // On class change (theme toggle)
      new MutationObserver(applyFavicon)
        .observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      applyFavicon();
    })();
  </script>
